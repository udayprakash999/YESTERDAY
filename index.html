<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YESTERDAY.exe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="computer">
        <p class="status">UNKNOWN DEVICE // EST. 1789</p>

        <h1>YESTERDAY.exe</h1>

        <div class="screen-container" id="screen" >
            <p>SYSTEM BOOTING...</p>
            <p>LOADING OLD MEMORIES</p>
            <p>CONNECTION ESTABLISHED</p>
            <br>
            <p>HELLO, USER.</p>
            <p>I HAVE BEEN WAITING FOR YOU.</p>
            <p>TYPE <span>help</span> TO BEGIN.</p>
        </div>

        <div class="input-area">
            <span>&gt;</span>
            <input type="text" id="command" placeholder="Enter a command..." autocomplete="off">
            <button id="runbtn">RUN</button>
        </div>

        <p class="status">SOME MEMORIES SHOULD STAY BURIED.</p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
